name: mosque-local
services:
  db:
    image: postgres:17-alpine
    env_file: .env.docker
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mosque -d mosque']
      interval: 3s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:8025:8025'
    volumes:
      - mail:/data
    environment:
      MP_DATABASE: /data/mail.db
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    env_file: .env.docker
    environment:
      MOSQUE_LOCAL_BACKEND: 'true'
      NODE_ENV: development
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - uploads:/app/local-data
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    init: true
volumes:
  database:
  uploads:
  mail:
